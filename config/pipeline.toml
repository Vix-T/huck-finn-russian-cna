# --- Cleaning -----------------------------------------------------------------

[clean]
encoding = "utf-8-sig"       # strips the BOM
unicode_form = "NFC"
log_context_chars = 30       # characters of context either side of a change in Ru#_changes.tsv
report_excerpt_chars = 100   # max characters of any text line quoted in the committed report
candidate_rate_per = 10000   # split-word candidate rate is reported per this many word tokens

# Rule b. Front matter removed by text match. A block runs from the first line whose
# stripped text starts with `first`, through the next line (inclusive) whose stripped
# text starts with `last`. Each block must be found exactly once, or the run fails.
[[clean.front_matter]]
text = "Ru1"
name = "Notice"
first = "За покушение отыскать побудительную причину"
last = "За покушение отыскать побудительную причину"

[[clean.front_matter]]
text = "Ru5"
name = "Notice"
first = "ПРЕДУПРЕЖДЕНИЕ"
last = "По приказу автора"

[[clean.front_matter]]
text = "Ru5"
name = "Explanatory"
first = "ОБЪЯСНЕНИЕ"
last = "АВТОР"

# Rule b, report only: lines proposed for trimming (never removed automatically).
[clean.front_back_proposals]
scan_lines = 15              # non-empty lines inspected at each end of each text
max_chars = 60               # only lines this short or shorter are considered
# A short line is proposed if it contains a keyword or is all caps.
keywords = ["Конец", "КОНЕЦ", "Глава", "ГЛАВА", "Перевод", "перевод", "Издательство", "издательство",
            "Марк Твен", "МАРК ТВЕН", "почтением", "слуга", "Гек Финн", "ГЕК ФИНН"]

# Rule c. Bracketed segments containing the marker are removed; all others are listed.
[clean.editorial_notes]
open = "["
close = "]"
marker = "Прим."

# Rule e. Latin look-alikes mapped to Cyrillic inside tokens with at least one Cyrillic letter.
[clean.latin_lookalikes]
a = "а"
e = "е"
o = "о"
p = "р"
c = "с"
x = "х"
y = "у"
k = "к"
A = "А"
B = "В"
E = "Е"
K = "К"
M = "М"
H = "Н"
O = "О"
P = "Р"
C = "С"
T = "Т"
X = "Х"

# Rule f. Standalone token replacements.
[clean.standalone_tokens]
II = "И"

# Rule g. Canonical punctuation.
[clean.punctuation]
dash = "—"
double_hyphen = "--"                     # two or more hyphen-minus in a row
spaced_dashes = ["–", "—", "-"]          # mapped to the canonical dash when spaces are on both sides
quote_chars = ["\"", "„", "“", "”", "'", "‘", "’"]
open_quote = "«"
close_quote = "»"
# A quote character is opening when preceded by start of line, whitespace or one of these:
opening_after = ["(", "[", "—", "–", "-", "«", "/"]
ellipsis_min_dots = 3                    # a run of this many or more full stops becomes the ellipsis
ellipsis_to = "…"
comma_runs = true                        # ",," (or longer) collapsed to ","

# Rule h. Broken hyphenation ("word - particle", "по - X") rejoined.
[clean.hyphenation]
particles = ["то", "либо", "нибудь", "ка", "таки"]
po_word = "по"
po_suffixes = ["ому", "ему", "ски", "цки", "ьи"]
prefixes = ["кое"]                            # "кое- X" -> "кое-X" for any Cyrillic word X
fixed_pairs = [["из", "под"], ["из", "за"]]   # "из- под" -> "из-под"
# Rule g leaves a fully spaced hyphen alone when a rule h pattern above matches it,
# so rule h rejoins every spacing variant.

# Rule i. Dictionary-based split-word repair (pymorphy3 word_is_known).
[clean.split_words]
# Pairs A B are joined when AB is a dictionary word and A or B is not; repeated until no change.
sample_size = 50            # joins per text sampled for manual review
seed = 20261019              # random seed for the review sample
# Guards (also used by rule i2):
never_join_after = ["не", "ни"]       # A (lowercased) in this list: never join
block_if_second_capitalized = true    # B starting with a capital letter: never join

# Rule i2. Within-text attestation join, runs after rule i.
[clean.attested_joins]
apply = true                 # false = preview only (review files and report); cleaned texts unchanged
min_attested = 2             # AB must occur as a single token at least this often in the same text
min_part_letters = 2         # i2-only guard: never join when A or B has fewer letters than this
sample_text = "Ru1"          # text whose would-be joins are sampled for hand-checking
sample_size = 100
seed = 20261020
top_n = 30                   # most frequent would-be joins listed in the report (sample_text only)
# Seeded sample of joins actually applied (only when apply = true), with wider context.
applied_sample_size = 40
applied_seed = 20261021
applied_context_chars = 40   # characters of context either side of the joined pair

# Rule j.
[clean.yo]
"ё" = "е"
"Ё" = "Е"

# --- Tokenization and tagging -----------------------------------------------------

[tag]
# Exact versions; tag.py refuses to run if the installed versions differ.
stanza_version = "1.15.0"
stanza_resources_version = "1.15.0"   # Stanza model resources (resources_1.15.0.json)
stanza_lang = "ru"
# Stanza processor -> model package. These are the Russian defaults for resources 1.15.0
# (UD SynTagRus); the POS tagger also loads its pretrained embeddings and character LMs.
stanza_packages = { tokenize = "syntagrus_nocharlm", pos = "syntagrus_charlm", lemma = "syntagrus_nocharlm" }
spacy_version = "3.8.16"
spacy_model = "ru_core_news_lg"
spacy_model_version = "3.8.0"
spacy_exclude = ["ner"]               # pipeline components not loaded (not needed for POS/lemma)
spacy_batch_size = 64                 # paragraphs per spaCy batch
# Content words: Stanza UPOS tags counted as content (is_content column).
content_upos = ["NOUN", "VERB", "ADJ", "ADV", "PROPN"]

[pos_check]
top_n = 10                            # UPOS tags ranked per text (old Figure 6 used the top 10)
verbforms = ["Fin", "Inf", "Part", "Conv"]
verbform_upos = ["VERB", "AUX"]       # tokens counted in the VerbForm breakdown
disagreement_top_n = 10               # most common Stanza/spaCy UPOS disagreement pairs per text
figure_dpi = 300
# Paragraph-level bootstrap: paragraphs resampled with replacement; percentile confidence intervals.
# One draw of paragraph indices per text, shared by both taggers; generator numpy default_rng([seed, text index]).
bootstrap_resamples = 1000
bootstrap_ci = 0.95
bootstrap_seed = 20261022
compare_pair = ["Ru4", "Ru5"]          # texts whose NOUN:VERB intervals are compared (Braude, Daruzes)
trend_endpoints = ["Ru1", "Ru5"]       # first and last translation for the verb-form trend

