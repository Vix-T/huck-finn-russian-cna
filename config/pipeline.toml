# --- mfinder (cross-check engine) ------------------------------------------------

[mfinder]
binary = "tools/mfinder/bin/mfinder"
seed_env = "MFINDER_SEED"        # read by the patched init_random_seed() (tools/mfinder/seed.patch)
seed_min = 1                     # ran2() takes a seed in 1 .. 2147483646; the patch rejects anything else
seed_max = 2147483646
# Flags after `-s <motif_size> -r <R> -f <prefix>`: quiet, save per-random-network counts (_MAT_R.txt),
# and write intermediate results after every random network (_INTER.txt, flushed each time), which
# scripts/mfinder_status.sh counts for progress. -oi changes no result (tests/test_mfinder.py).
extra_flags = ["-q", "-orall", "-oi"]

# Final run: all five texts in parallel (scripts/run_mfinder_all.sh), one seed per text derived from the
# master seed by `uv run python -m huckfinn_cna.mfinder_seeds` (SeedSequence([master_seed, text index])).
[mfinder.final]
r = 1000
master_seed = 20261023
# Generated by `uv run python -m huckfinn_cna.mfinder_seeds`. Do not edit by hand.
seeds = { Ru1 = 1089013924, Ru2 = 2088918129, Ru3 = 751178630, Ru4 = 829752018, Ru5 = 1779418725 }

# --- Motif statistics (motifs.py) ---------------------------------------------------

[motifs]
null_sd_ddof = 1                 # sample SD of the random counts, as mfinder prints it (checked against _OUT.txt)
abundance_epsilon = 4            # Milo et al. 2004: delta = (N_real - mean) / (N_real + mean + epsilon)
min_count = 5                    # flag a triad when N_real or the null mean is below this
sentinel = 888888                # value mfinder writes when a statistic is undefined
z_threshold = 2.0                # |Z| > this is starred, as in Figure 9 of Final Report 3
fdr_alpha = 0.05                 # Benjamini-Hochberg q-values below this are called significant
mfinder_z_tolerance = 0.006      # mfinder prints Z to 2 decimals; recomputed Z must agree within this

# --- Classic stylometric measures (lexical.py) ----------------------------------------

[lexical]
# Tokens: word tokens (is_word = 1); Stanza lemma lowercased, then mapped with networks.lemma_char_map
# (ё -> е), the same rule as network nodes. View "all" keeps every word token (primary view);
# view "content" keeps tokens whose Stanza UPOS is in tag.content_upos.
views = ["all", "content"]
primary_view = "all"
msttr_chunk = 2000              # MSTTR chunk length (old code: 2,000)
msttr_min_last_fraction = 0.5   # old code: the final partial chunk is dropped if shorter than this share of a chunk
mattr_windows = [100, 500, 1000]
mattr_primary = 500
mtld_threshold = 0.72           # McCarthy & Jarvis 2010; a factor ends when the running TTR is <= threshold
hdd_draws = 42                  # HD-D sample size (McCarthy & Jarvis 2007)
yule_scale = 10000              # K = scale * (sum_i i^2 V_i - N) / N^2
honore_scale = 100              # R = scale * ln N / (1 - V1 / V)
entropy_base = 2
crosscheck_rel_tol = 1e-6       # lexicalrichness must agree with lexical.py within this relative tolerance. Not tighter:
                                # its HD-D uses scipy hypergeom.pmf, which is off by ~1e-9 relative (Ru1); lexical.py's HD-D
                                # equals exact rational arithmetic to ~1e-14 (tests/test_lexical.py checks a toy case)

# Equal-length samples: N = the shortest text's token count (per view) rounded down to a multiple of
# sample_round. A sample starts at the first token of a paragraph and takes exactly N consecutive tokens
# of the view. Non-overlapping samples run from the start of the text, each starting at the first
# paragraph start at or after the end of the previous one. Random windows: random_windows starts drawn
# uniformly, with replacement, from the paragraph starts that leave N tokens.
sample_round = 1000
random_windows = 200
single_sample_texts = ["Ru2"]   # contribute only their one sample from the start of the text (no random windows)

# Paragraph-level bootstrap for whole-text measures and sentence length: paragraphs resampled with
# replacement and concatenated in the drawn order; percentile intervals. Generators:
# numpy default_rng([master_seed, stream, text index]), text index 0-based in corpus.texts.
bootstrap_resamples = 1000
bootstrap_ci = 0.95
# Lexical measures reported with a bootstrap interval (project owner's decision, 2026-10-26). For MSTTR, MATTR,
# MTLD, Honoré's R and entropy the paragraph bootstrap is biased (shuffled paragraphs break local repetition;
# duplicated paragraphs remove hapaxes), so their uncertainty is the spread of the equal-length random windows;
# their bootstrap is still computed and shown as a diagnostic. Sentence-length measures always get intervals.
bootstrap_measures = ["yule_k", "hdd"]
master_seed = 20261026          # separate from the POS bootstrap (20261022) and mfinder (20261023) seeds
bootstrap_stream = 0
windows_stream = 1
quantile_method = "linear"      # numpy quantile method for median, IQR and percentile intervals
workers = 1                     # processes (one text each); 1 = sequential. Results do not depend on it (seeds are per text)

# Old values (Final Report 3), exact, from the old local folder's result CSVs (read-only; see the inventory in
# docs/audit/data_audit.md): yule_k, honore from lexical_diversity_results.csv; msttr (chunked_ttr), sentence_length
# (avg_sentence_length) and entropy (unigram_entropy) from stylometric_summary.csv. Each recomputes exactly from the
# old lemmatized files with the old formulas, and rounds to the bar labels of Figures 1-5.
[lexical.old]
source = "lexical_diversity_results.csv, stylometric_summary.csv (old local folder, 2025-10-10)"
yule_k = { Ru1 = 13.317840789986276, Ru2 = 20.294620759396, Ru3 = 17.997197941376236, Ru4 = 24.88128539679687, Ru5 = 23.23676691575819 }
honore = { Ru1 = 1955.170506053911, Ru2 = 2060.2956305598677, Ru3 = 1962.9377831430002, Ru4 = 1963.7550741022717, Ru5 = 1943.3096287519809 }
msttr = { Ru1 = 0.551588245, Ru2 = 0.519576923, Ru3 = 0.519237264, Ru4 = 0.497833333, Ru5 = 0.485270833 }
sentence_length = { Ru1 = 18.62309224, Ru2 = 17.02145923, Ru3 = 14.98172914, Ru4 = 19.96419882, Ru5 = 19.16898378 }
entropy = { Ru1 = 9.949171773, Ru2 = 9.516044913, Ru3 = 9.622357432, Ru4 = 9.325949444, Ru5 = 9.362473047 }
# Figure-label readings used before the CSVs were found (all equal the CSV values rounded to the label precision).
figure_labels = { yule_k = [13.3, 20.3, 18.0, 24.9, 23.2], honore = [1955.2, 2060.3, 1962.9, 1963.8, 1943.3], msttr = [0.552, 0.520, 0.519, 0.498, 0.485], sentence_length = [18.6, 17.0, 15.0, 20.0, 19.2], entropy = [9.949, 9.516, 9.622, 9.326, 9.362] }

# --- Betweenness centrality (centrality.py) ----------------------------------------------

[centrality]
# Networks: the frozen networks-v1 files (data/interim/networks), checked against paths.network_checksums.
# Variants (betweenness normalized as networkx does: divided by (n-1)(n-2), halved for undirected; n = all nodes):
#   undirected  - primary: exact, unweighted, on the undirected version (an edge in either direction links the pair)
#   directed    - secondary: exact, unweighted, directed
#   weighted    - sensitivity, the old method: directed, distance = 1 / bigram count
variants = ["undirected", "directed", "weighted"]
primary = "undirected"
crosscheck_text = "Ru2"          # smallest network: igraph vs networkx, unweighted undirected
crosscheck_abs_tol = 1e-9        # on normalized betweenness

# Frequency adjustment (Amancio 2015): the text's word tokens are shuffled across the whole text and
# refilled into the sentences, keeping every sentence's length; each shuffled network is rebuilt with the
# network rules (sentence-bounded, self-loops dropped) and its undirected unweighted betweenness computed.
# adjusted = real / mean(shuffled); z = (real - mean) / sd (ddof = 1). Undefined when the mean (or sd) is 0.
# Generator: numpy default_rng([master_seed, text index]), one per text, permutations drawn in order.
shuffles = 30
shuffle_sd_ddof = 1
master_seed = 20261027           # separate from 20261022 (POS), 20261023 (mfinder), 20261026 (lexical)
# Adjusted ranks, top lists, stability and heatmap use only each text's most frequent lemmas (project owner's
# decision, 2026-10-27): ranked by adjusted score, words seen once dominate (their shuffled mean is tiny and noisy).
# Eligible: frequency >= the frequency of the text's adjusted_rank_top_frequent-th most frequent lemma (ties included).
adjusted_rank_top_frequent = 200

top_n = 30                       # words listed per text and ranking
stability_top_n = 100            # Spearman over the union of the two variants' top-100 words, full ranks
heatmap_top_n = 20               # old Figure 12: union of each text's top 20 ...
heatmap_max_columns = 30         # ... sorted by mean rank (absent word: rank heatmap_absent_rank), first 30 kept
heatmap_absent_rank = 1000       # old code's penalty when sorting columns
heatmap_color_max = 100          # colour scale clipped here; cells show the actual rank
focus_words = ["сказать", "говорить", "и", "я", "в"]

# --- Delta, clustering and embedding (delta.py) --------------------------------------------

[delta]
# Tokens: word tokens, Stanza lemma lowercased, networks.lemma_char_map (ё -> е). View "all" (primary) counts every
# word token; view "content" counts tokens whose Stanza UPOS is in tag.content_upos. The denominator of a relative
# frequency is always the unit's total word tokens (all words), in both views.
views = ["all", "content"]
primary_view = "all"
# Blocks: block_words consecutive word tokens starting at a paragraph start; each next block starts at the first
# paragraph start at or after the previous block's end (the rule of lexical equal-length samples); remainder dropped.
block_words = 5000
# MFW: ranked by the mean over all blocks (all texts) of per-block relative frequency (stylo convention); ties
# alphabetical. Culling 100 = keep only words that occur in all five whole texts.
mfw = [100, 200, 300, 400, 500, 600, 700, 800, 900, 1000]
culling = [0, 100]
distances = ["cosine", "classic"]   # Cosine Delta = 1 - cos(z_a, z_b); Classic Delta = sum |z_a - z_b| / N
zscore_ddof = 1                     # column means and SDs over all blocks of all texts; applied to blocks and whole texts
primary = { mfw = 300, culling = 0, distance = "cosine" }
linkage = "average"                 # primary; "complete" as a check
linkage_check = "complete"
ward_check = true                   # Ward on Euclidean distance between L2-normalized z-score vectors (sensitivity)
consensus_threshold = 0.5           # majority rule: a clade enters when it occurs in >= this share of trees
eder_weights = [1.0, 0.5, 0.5]      # nearest neighbour, then the two runners-up
# PCA on standardized block-level relative frequencies (z-scores as above), view all, culling 0.
pca_mfw = [100, 300, 1000]
pca_components = 4
pca_top_loadings = 10
abridged = ["Ru2", "Ru3"]
abridged_flag_eta2 = 0.5            # flag a PC when the abridged/full grouping explains >= this share of its variance
# Classical (Torgerson) MDS on the text-level Cosine Delta matrix at mds_setting.
mds_setting = { mfw = 300, culling = 0 }
# Spectral embedding (appendix): text-level z-scores at the primary setting, cosine affinity with negatives set to 0,
# sklearn.manifold.spectral_embedding(norm_laplacian=True, drop_first=True).
spectral_random_state = 20261027
spectral_check_states = [0, 1, 2, 42]   # layouts compared across these random_states
# Diagnostic: shared word n-grams between each pair of texts (surface word tokens, lowercased, ё -> е); tests whether
# two translations share wording (textual dependence) rather than only style.
overlap_ngrams = [5, 8]
# Appendix Figure 13: content words, the top N by total count over the five texts, ranked within that set per text.
fig13_top_n = 30
# Old files (in paths.old_repo, read-only) used to recompute the old Figures 7-8 and the old Delta exactly.
old_dtm_all = "document_term_matrix_with_stops.csv"
old_dtm_content = "document_term_matrix.csv"
old_lemmatized = "Ru{i}_clean_lemmatized.txt"
old_tfidf_random_state = 42
