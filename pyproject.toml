[project]
name = "huckfinn-cna"
version = "0.1.0"
description = "Stylometry and complex network analysis of five Russian translations of Huckleberry Finn"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pymorphy3>=2.0.6",
    "pymorphy3-dicts-ru>=2.4.417150.4580142",
    "razdel==0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/huckfinn_cna"]
